# /etc/asound.conf for Zozo's box (PLAN M10). Installed by deploy/host-setup.sh
# only when /etc/asound.conf does not exist (otherwise as asound.conf.zozobox-new).
#
# Two outputs, each:  plug -> softvol (HARD CAP) -> dmix -> hw
#   zozobox_handset : the Native Union POP Phone earpiece (USB)
#   zozobox_speaker : the box speaker's USB DAC
# box.toml points the app at them:  [audio.handset] alsa_pcm = "zozobox_handset"
#                                   [audio.speaker] alsa_pcm = "zozobox_speaker"
#
# Why: the app caps each card's mixer at a hearing-safe ceiling
# (max_fraction, SPEC 5). The softvol max_dB below is the BACKSTOP: no matter
# what the mixer or the app does, audio through these PCMs can never be louder
# than max_dB relative to full scale. Calibrate during bring-up
# (docs/BRINGUP.md): set the softvol control to 100%, play the calibration
# clip at dashboard volume 100%, measure 75-80 dBA at the earpiece, lower
# max_dB until it is at or under the target, then `alsactl store`.
#
# dmix lets a click and speech overlap on one card (USB cards allow one
# opener otherwise). Every sound asset is 48 kHz; plug converts the rest.
#
# CARD NAMES ARE PLACEHOLDERS: check `aplay -l` (the [..] short name) and
# replace "Phone" and "Device" here AND in ~/.config/zozobox/box.toml. If a card is
# mono, set channels 1 in its dmix slave (`aplay -D hw:CARD=X --dump-hw-params /dev/zero`).

# ---------------------------------------------------------------- handset ---
pcm.zozobox_handset_dmix {
    type dmix
    ipc_key 52101
    ipc_key_add_uid false
    ipc_perm 0660
    slave {
        pcm "hw:CARD=Phone,DEV=0"
        rate 48000
        format S16_LE
        channels 2
        period_size 1024
        buffer_size 8192
    }
}

pcm.zozobox_handset_capped {
    type softvol
    slave.pcm "zozobox_handset_dmix"
    control {
        name "Zozobox Handset Cap"
        card Phone
    }
    min_dB -40.0
    # HARD CAP for the earpiece. Start low; calibrate in bring-up.
    max_dB -12.0
    resolution 256
}

pcm.zozobox_handset {
    type plug
    slave.pcm "zozobox_handset_capped"
}

# ---------------------------------------------------------------- speaker ---
pcm.zozobox_speaker_dmix {
    type dmix
    ipc_key 52102
    ipc_key_add_uid false
    ipc_perm 0660
    slave {
        pcm "hw:CARD=Device,DEV=0"
        rate 48000
        format S16_LE
        channels 2
        period_size 1024
        buffer_size 8192
    }
}

pcm.zozobox_speaker_capped {
    type softvol
    slave.pcm "zozobox_speaker_dmix"
    control {
        name "Zozobox Speaker Cap"
        card Device
    }
    min_dB -40.0
    # HARD CAP for the box speaker. Start low; calibrate in bring-up.
    max_dB -6.0
    resolution 256
}

pcm.zozobox_speaker {
    type plug
    slave.pcm "zozobox_speaker_capped"
}
