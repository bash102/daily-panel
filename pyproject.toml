[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zozobox"
version = "0.1.0"
description = "Zozo's button box: Raspberry Pi 3 toddler panel"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pi = [
  "gpiozero>=2.0",
  "lgpio",
  "adafruit-blinka",
  "adafruit-circuitpython-pca9685",
  "brother_ql==0.9.4",
  "pyusb",
  "anthropic>=2.14",
  "openai>=3.59",
  "fastapi",
  "jinja2",
  "uvicorn",
  "python-multipart",
  "Pillow",
]
dev = ["pytest>=8", "httpx", "fastapi", "jinja2", "python-multipart", "Pillow"]

[project.scripts]
zozobox-bench = "zozobox.bench:main"
zozobox-engine = "zozobox.app:main"
zozobox-import-clip = "zozobox.import_clip:main"

[tool.setuptools.packages.find]
include = ["zozobox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
